<script>
  // Startup log, kept from the first moment so errors on devices we can't attach a console to can be read.
  window.KLOG = []; window.klog = m => { KLOG.push((performance.now() / 1000).toFixed(1) + 's  ' + m); window.kshow?.(); };
  addEventListener('error', e => klog('error: ' + (e.message || e.error) + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno));
  addEventListener('unhandledrejection', e => klog('rejected: ' + (e.reason?.stack || e.reason?.message || e.reason)));
  // Testing aid: a hidden browser pane pauses animation frames; ?timerclock drives them from a timer instead.
  if (location.search.includes('timerclock')) window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16);
  klog(navigator.userAgent + '  ' + screen.width + 'x' + screen.height + ' @' + devicePixelRatio);
</script>
<title>曇り Kumori</title>
<style>
  html,body{margin:0;height:100%;background:#07080c;overflow:hidden;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:none}
  #msg{position:fixed;inset:0;display:none;place-content:center;text-align:center;color:#d9d4cc;font:300 17px/1.6 -apple-system,system-ui,sans-serif;padding:2rem}
  #dbg{position:fixed;left:12px;top:12px;color:#9fe8c0;font:11px/1.45 ui-monospace,monospace;white-space:pre;pointer-events:none;text-shadow:0 0 3px #000}
  /* Shown while the GPU warms up: a still of the first frame, fogging over, then dissolved into the live window. */
  #veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:#07080c;transition:opacity 1.6s ease-in-out}
  #veil i{position:absolute;inset:-24px;background:url(assets/first.jpg) center/cover}
  #veil .sharp{filter:blur(1.2px)}
  #veil .soft{filter:blur(18px) brightness(1.08);opacity:0;animation:fog 5s cubic-bezier(.3,.1,.3,1) .3s forwards}
  #veil .haze{background:radial-gradient(120% 90% at 50% 45%,rgba(150,148,156,.5),rgba(120,120,130,.62));opacity:0;animation:fog 6s ease-out .5s forwards}
  @keyframes fog{to{opacity:1}}
  body.live #veil{opacity:0}
  #msg{z-index:2;text-shadow:0 1px 8px #000}
  /* Startup report: shown with ?diag, or by itself if the window hasn't come alive in 20 s, so a phone user can screenshot it. */
  #diag{position:fixed;left:0;right:0;bottom:0;max-height:60%;overflow:auto;z-index:3;display:none;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(5,6,10,.88);color:#cfe9d8;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="veil" aria-hidden="true"><i class="sharp"></i><i class="soft"></i><i class="haze"></i></div>
<canvas id="c" aria-label="A foggy window you can wipe with your finger"></canvas>
<div id="msg" role="alert"></div><div id="dbg" hidden></div><pre id="diag"></pre>
<script>
  window.kshow = () => { const d = document.getElementById('diag'); if (d && d.dataset.on) d.textContent = 'Kumori startup report (screenshot this)\n\n' + KLOG.join('\n'); };
  const diagOn = () => { const d = document.getElementById('diag'); d.dataset.on = 1; d.style.display = 'block'; kshow(); };
  if (location.search.includes('diag')) diagOn();
  setTimeout(() => { if (!document.body.classList.contains('live')) { klog('not live after 20 s'); diagOn(); } }, 20000);
</script>
